    <script>
      // HMR is disabled in AI Studio environment. Suppress WebSocket errors.
      window.addEventListener('unhandledrejection', function(event) {
        var reasonStr = String(event.reason && (event.reason.message || event.reason) || '');
        if (reasonStr.indexOf('WebSocket') !== -1 || reasonStr.indexOf('vite') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = String(event.message || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>

    <div id="root"></div>
